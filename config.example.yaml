# Telegram API credentials — get from https://my.telegram.org
api_id: 12345678
api_secret: "your_api_hash_here"

# Where to send keyword match notifications.
# Варианты:
#   "me"              — Избранное (Saved Messages)
#   "@username"       — публичный канал или группа
#   -1001234567890    — приватная группа/канал по numeric ID (без кавычек)
destination_chat: "me"

# Keywords to monitor. Each entry is a plain string (case-insensitive
# substring match by default). Prefix with "re:" to use a regex pattern.
keywords:
  - "urgent"
  - "budget approval"
  - "re:invoice\\s*#?\\d+"

# --- Optional settings ---

session_file: "monitor.session"
db_file: "seen.db"

# Seconds to wait between forwarded messages (flood protection).
send_delay_seconds: 0.5

# Max forwarded messages per minute across all keywords (hard cap).
# Для destination = Saved Messages / собственный канал можно безопасно повышать:
# антиспам Telegram срабатывает в первую очередь на жалобы получателей,
# которых в этом сценарии нет. Лимит оставлен как safety-net.
rate_limit_per_minute: 60

# Logging level: DEBUG, INFO, WARNING, ERROR
log_level: "INFO"

# Also log matches to stdout.
log_to_stdout: true

# Optional log file path. Omit or set to null to disable file logging.
log_file: null

# --- Chat filtering (optional) ---
# Только один из списков может быть задан одновременно.
#
# Мониторить только эти чаты:
# chat_whitelist:
#   - -1001234567890
#   - -1009876543210
#
# Мониторить всё кроме этих чатов:
# chat_blacklist:
#   - -1001234567890

# --- Proxy (optional) ---
# Раскомментировать если провайдер блокирует прямые подключения к Telegram.
#
# SOCKS5 (рекомендуется):
# proxy:
#   type: socks5
#   host: "127.0.0.1"
#   port: 1080
#   username: "user"    # опционально
#   password: "pass"    # опционально
#
# MTProto:
# proxy:
#   type: mtproto
#   host: "proxy.example.com"
#   port: 443
#   secret: "abc123..."
