services:
  monitor:
    image: python:3.13-slim
    working_dir: /app
    command: >
      sh -c "[ -f /venv/bin/pip ] || python -m venv /venv &&
             /venv/bin/pip install -r requirements.txt -q &&
             /venv/bin/python main.py"
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - .:/app
      - venv:/venv

volumes:
  venv:
